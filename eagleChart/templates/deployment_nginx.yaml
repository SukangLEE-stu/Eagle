apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-static
  namespace: {{ .Values.namespace }}
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-static
  template:
    metadata:
      labels:
        app: nginx-static
    spec:
      volumes:
        - name: static-files
          persistentVolumeClaim:
            claimName: static-files-pvc
        - name: html-volume
          configMap:
            name: eagle-app-index-html
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: static-files
              mountPath: /usr/share/nginx/html
            - name: html-volume
              mountPath: /usr/share/nginx/html/index.html   # 挂载为单个文件
              subPath: index.html   # 只挂载该文件