apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.mysql.initConfigMap | default "mysql-init-sql" }}
  namespace: {{ .Values.namespace | default "default" }}
  labels:
    app: eagle-web-app
data:
  init.sql: |
{{- if .Files.Get "files/init.sql" }}
{{ .Files.Get "files/init.sql" | indent 4 }}
{{- else }}
    -- 默认初始化SQL
    CREATE DATABASE IF NOT EXISTS `eagle_db` DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
    USE `eagle_db`;

    -- 可以在这里添加更多初始化SQL
    -- 例如创建表、插入初始数据等
{{- end }}