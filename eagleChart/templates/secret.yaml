apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.mysql.secretName | default "mysql-secret" }}
  namespace: {{ .Values.namespace | default "default" }}
  labels:
    app: eagle-web-app
type: Opaque
data:
  root-password: {{ .Values.mysql.rootPassword | b64enc | quote }}
  user-password: {{ .Values.mysql.userPassword | b64enc | quote }}